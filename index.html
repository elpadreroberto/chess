        function renderVariationsList() {
            const varContainer = document.getElementById('variations-container');
            if (!varContainer || !activeOpeningId || !OPENING_MODULES[activeOpeningId]) return;

            const lines = getOpeningLines(activeOpeningId);
            if (lines.length === 0) {
                hideVariationsList();
                return;
            }

            varContainer.innerHTML = '<h4 class="text-[10px] font-black text-fuchsia-300 uppercase tracking-[0.2em] mb-1">Elegir variante</h4>';
            lines.forEach((v) => {
                const btn = document.createElement('button');
                const mainStyle = v.isMain
                    ? "w-full text-left px-4 py-2.5 bg-emerald-700/40 hover:bg-emerald-600/50 rounded-xl font-bold border border-emerald-500/60 transition-all text-sm text-white flex justify-between items-center group shadow-md"
                    : "w-full text-left px-4 py-2.5 bg-slate-800/80 hover:bg-slate-700 rounded-xl font-bold border border-slate-600 transition-all text-sm text-white flex justify-between items-center group shadow-md";
                btn.className = mainStyle;
                const badge = v.isMain
                    ? `<span class="text-[10px] uppercase tracking-wider text-emerald-300 font-black mr-2">Principal</span>`
                    : '';
                btn.innerHTML = `<span class="flex items-center gap-1">${badge}<span>${v.name}</span></span> <span class="text-xs text-slate-400 font-normal group-hover:text-slate-200 transition-colors">${v.subtitle} &rarr;</span>`;
                btn.onclick = () => loadVariation(v);
                varContainer.appendChild(btn);
            });
            varContainer.classList.remove('hidden');
            variationsPanelOpen = true;
            setVariantsBtnActive(true);
        }

        function enterFreePlayIfNeeded() {
            if (!currentSteps) return;
            if (currentStep >= theoryLength() && !freePlayMode) {
                freePlayMode = true;
                // Al terminar la teoría, mostrar variantes arriba de inmediato
                variationsPanelOpen = true;
            }
        }

        function skipToVariations() {
            if (!currentSteps || currentSteps.length === 0) return;

            // Segundo clic: ocultar lista de inmediato
            if (variationsPanelOpen) {
                hideVariationsList();
                return;
            }

            if (systemTimeout) {
                clearTimeout(systemTimeout);
                systemTimeout = null;
            }

            // Si aún no terminó la teoría, saltar al final
            if (!isTheoryComplete()) {
                while (currentStep < theoryLength()) {
                    const step = currentSteps[currentStep];
                    if (!step) break;
                    const move = isWhiteTurn ? step.w : step.b;
                    if (move) {
                        executeMove(move.from[0], move.from[1], move.to[0], move.to[1], move);
                    } else {
                        break;
                    }
                }
                freePlayMode = true;
            }

            setControlsDisabled(false);
            variationsPanelOpen = true;
            renderVariationsList();
            updateUI();
        }

        function loadVariation(variationData) {
            currentSteps = variationData.steps;
            const sub = document.getElementById('game-subtitle');
            // Variante en estudio siempre en color ámbar (clase fija)
            sub.textContent = variationData.isMain
                ? (variationData.name || variationData.subtitle)
                : (variationData.name || variationData.subtitle);
            sub.className = 'game-subtitle-sm';
            // Mantener el nombre de la apertura principal en cian
            if (activeOpeningId && OPENING_MODULES[activeOpeningId]) {
                const t = document.getElementById('game-title');
                t.textContent = OPENING_MODULES[activeOpeningId].title;
                t.className = 'game-title-sm';
            }

            hideVariationsList();
            initGame();
        }

        function clearSelection() {
            selectedSquare = null;
            dragFrom = null;
            touchState = null;
            legalTargets = [];
        }

        function isPieceOwnedBySide(piece, sideWhite) {
            if (!piece) return false;
            const isWhite = piece === piece.toUpperCase();
            return sideWhite ? isWhite : !isWhite;
        }

        function isSelectablePiece(piece) {
            if (!piece) return false;
            if (chessGame && chessGame.game_over()) return false;
            // En teoría y en libre: solo el bando al que le toca
            return isPieceOwnedBySide(piece, isWhiteTurn);
        }

        function getLegalTargetsFor(r, c) {
            if (!chessGame || !freePlayMode) return [];
            const sq = rcToAlg(r, c);
            const moves = chessGame.moves({ square: sq, verbose: true }) || [];
            return moves.map(m => m.to);
        }

        function initGame() {
            if (systemTimeout) clearTimeout(systemTimeout);
            systemTimeout = null;
            freePlayMode = false;
            lastMoveSan = null;
            hideVariationsList();
            chessGame = createChessEngine();
            if (chessGame) {
                syncFromChess();
            } else {
                boardState = INITIAL_BOARD.map(row => [...row]);
                isWhiteTurn = true;
            }
            currentStep = 0;
            clearSelection();
            gameHistory = [];
            renderBoard();
            updateUI();
            setControlsDisabled(false);
            if (userRole === 'b' && isWhiteTurn && currentSteps && currentSteps.length > 0 && !freePlayMode) {
                setControlsDisabled(true);
                systemTimeout = setTimeout(autoPlayOpponent, 1000);
            }
        }

        function resetOpening() {
            if (!currentSteps || currentSteps.length === 0) return;
            if (systemTimeout) {
                clearTimeout(systemTimeout);
                systemTimeout = null;
            }
            hideVariationsList();
            initGame();
        }

        function setControlsDisabled(disabled) {
            const btns = ['btn-undo-move', 'btn-step-one', 'btn-next-move', 'btn-white', 'btn-black'];
            btns.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    if (disabled) el.classList.add('btn-disabled');
                    else el.classList.remove('btn-disabled');
                }
            });
        }

        function undoMove() {
            if (gameHistory.length === 0) return;
            if (systemTimeout) {
                clearTimeout(systemTimeout);
                systemTimeout = null;
            }

            const isMyTurn = (userRole === 'w' && isWhiteTurn) || (userRole === 'b' && !isWhiteTurn);
            // En modo libre: un ply; en teoría (turno del usuario): a menudo dos (propia + rival)
            let stepsToUndo = (!freePlayMode && isMyTurn && gameHistory.length >= 2) ? 2 : 1;

            for (let i = 0; i < stepsToUndo; i++) {
                if (gameHistory.length === 0) break;
                const last = gameHistory.pop();
                if (chessGame && last.fen) {
                    chessGame.load(last.fen);
                    syncFromChess();
                } else if (last.board) {
                    boardState = last.board;
                    isWhiteTurn = last.whiteTurn;
                }
                currentStep = last.step;
                freePlayMode = !!last.freePlay;
                lastMoveSan = last.lastMoveSan || null;
            }
            clearSelection();
            renderBoard();
            updateUI();
            setControlsDisabled(false);
        }

        /** Solo un ply (una media jugada): no responde el rival automáticamente. */
        function stepOnePly() {
            if (freePlayMode) {
                if (!chessGame || chessGame.game_over()) return;
                const moves = chessGame.moves({ verbose: true });
                if (!moves.length) return;
                const m = moves[Math.floor(Math.random() * moves.length)];
                const [fr, fc] = algToRc(m.from);
                const [tr, tc] = algToRc(m.to);
                pushHistory();
                const applied = applyEngineMove(fr, fc, tr, tc, m.promotion || 'q');
                if (!applied) {
                    gameHistory.pop();
                    return;
                }
                clearSelection();
                renderBoard();
                updateUI();
                return;
            }
            if (!currentSteps || currentStep >= theoryLength()) return;
            const step = currentSteps[currentStep];
            const expected = isWhiteTurn ? step.w : step.b;
            if (!expected) return;
            executeMove(expected.from[0], expected.from[1], expected.to[0], expected.to[1], expected);
            setControlsDisabled(false);
            updateUI();
        }

        /** Auto-jugada: un ply tuyo + respuesta del rival (dos plies en teoría). */
        function stepNextMove() {
            if (freePlayMode) {
                // En partida libre: una jugada del bando actual; el rival responde solo si toca
                playRandomLegalMove();
                return;
            }
            if (!currentSteps || currentStep >= theoryLength()) return;
            const step = currentSteps[currentStep];
            const expected = isWhiteTurn ? step.w : step.b;
            if (!expected) return;
            executeMove(expected.from[0], expected.from[1], expected.to[0], expected.to[1], expected);
            if (!isTheoryComplete() && currentStep < theoryLength()) {
                const stillTheory = currentStep < theoryLength();
                if (stillTheory) {
                    setControlsDisabled(true);
                    systemTimeout = setTimeout(autoPlayOpponent, 800);
                }
            }
            updateUI();
        }

        function playRandomLegalMove() {
            if (!chessGame || chessGame.game_over()) return;
            const moves = chessGame.moves({ verbose: true });
            if (!moves.length) return;
            const m = moves[Math.floor(Math.random() * moves.length)];
            const [fr, fc] = algToRc(m.from);
            const [tr, tc] = algToRc(m.to);
            executeFreeMove(fr, fc, tr, tc);
            updateUI();
        }

        function pushHistory() {
            gameHistory.push({
                fen: chessGame ? chessGame.fen() : null,
                board: JSON.parse(JSON.stringify(boardState)),
                whiteTurn: isWhiteTurn,
                step: currentStep,
                freePlay: freePlayMode,
                lastMoveSan: lastMoveSan
            });
        }

        function applyEngineMove(fr, fc, tr, tc, promotion) {
            if (!chessGame) return null;
            const from = rcToAlg(fr, fc);
            const to = rcToAlg(tr, tc);
            const move = chessGame.move({ from, to, promotion: promotion || 'q' });
            if (move) {
                lastMoveSan = move.san;
                syncFromChess();
                return move;
            }
            return null;
        }

        function tryPlayOnEngine(game, moveData) {
            if (!game || !moveData) return false;
            if (moveData.from && moveData.to) {
                const from = rcToAlg(moveData.from[0], moveData.from[1]);
                const to = rcToAlg(moveData.to[0], moveData.to[1]);
                const m = game.move({ from, to, promotion: moveData.promotion || 'q' });
                if (m) return true;
            }
            if (moveData.san) {
                const san = moveData.san.replace(/0-0-0/g, 'O-O-O').replace(/0-0/g, 'O-O');
                const m = game.move(san);
                if (m) return true;
            }
            return false;
        }

        /** Reconstruye chess.js repitiendo la teoría hasta la posición actual. */
        function resyncChessFromTheoryProgress() {
            if (typeof Chess === 'undefined' || !currentSteps) return;
            const g = new Chess();
            for (let s = 0; s < currentSteps.length; s++) {
                const step = currentSteps[s];
                if (!step) break;
                if (s < currentStep) {
                    tryPlayOnEngine(g, step.w);
                    tryPlayOnEngine(g, step.b);
                } else if (s === currentStep) {
                    if (!isWhiteTurn) tryPlayOnEngine(g, step.w);
                    break;
                } else {
                    break;
                }
            }
            chessGame = g;
            syncFromChess();
        }

        /* ─── Stockfish (rival tras memorizar la apertura) ─── */
        const SF_LEVELS = [
            { id: 'torpe', name: 'Torpe', short: 'T', skill: 0, depth: 2, movetime: 100, blunderChance: 0.45 },
            { id: 'basico', name: 'Básico', short: 'B', skill: 5, depth: 5, movetime: 250, blunderChance: 0.12 },
            { id: 'medio', name: 'Medio', short: 'M', skill: 12, depth: 9, movetime: 450, blunderChance: 0.03 },
            { id: 'avanzado', name: 'Avanzado', short: 'A', skill: 18, depth: 14, movetime: 900, blunderChance: 0 }
        ];
        let sfLevelIndex = 0; // por defecto: Torpe
        let stockfishWorker = null;
        let stockfishReady = false;
        let stockfishLoading = null;
        let stockfishBusy = false;

        function getSfLevel() {
            return SF_LEVELS[sfLevelIndex] || SF_LEVELS[0];
        }

        function updateStockfishUI() {
            const lv = getSfLevel();
            const label = document.getElementById('stockfish-level-label');
            const badge = document.getElementById('sf-badge');
            const btn = document.getElementById('btn-stockfish');
            if (label) label.textContent = `Stockfish · ${lv.name}`;
            if (badge) badge.textContent = lv.short;
            if (btn) {
                btn.title = `Stockfish: ${lv.name} (pulsa para cambiar nivel)`;
                btn.setAttribute('aria-label', `Nivel Stockfish: ${lv.name}`);
            }
        }

        function cycleStockfishLevel() {
            sfLevelIndex = (sfLevelIndex + 1) % SF_LEVELS.length;
            updateStockfishUI();
            // Reconfigurar motor si ya está listo
            if (stockfishWorker && stockfishReady) {
                const lv = getSfLevel();
                stockfishWorker.postMessage(`setoption name Skill Level value ${lv.skill}`);
            }
        }

        function ensureStockfish() {
            if (stockfishWorker && stockfishReady) return Promise.resolve(stockfishWorker);
            if (stockfishLoading) return stockfishLoading;

            stockfishLoading = (async () => {
                const urls = [
                    'https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js',
                    'https://unpkg.com/stockfish.js@10.0.2/stockfish.js'
                ];
                let lastErr = null;
                for (const url of urls) {
                    try {
                        const res = await fetch(url, { mode: 'cors' });
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const code = await res.text();
                        const blob = new Blob([code], { type: 'application/javascript' });
                        const blobUrl = URL.createObjectURL(blob);
                        const worker = new Worker(blobUrl);

                        await new Promise((resolve, reject) => {
                            const t = setTimeout(() => reject(new Error('timeout stockfish')), 12000);
                            const onMsg = (e) => {
                                const line = String(e.data || '');
                                if (line === 'uciok' || line.includes('uciok')) {
                                    clearTimeout(t);
                                    worker.removeEventListener('message', onMsg);
                                    resolve();
                                }
                            };
                            worker.addEventListener('message', onMsg);
                            worker.onerror = (err) => {
                                clearTimeout(t);
                                reject(err);
                            };
                            worker.postMessage('uci');
                        });

                        stockfishWorker = worker;
                        stockfishReady = true;
                        const lv = getSfLevel();
                        worker.postMessage('setoption name Skill Level value ' + lv.skill);
                        worker.postMessage('isready');
                        return worker;
                    } catch (err) {
                        lastErr = err;
                        console.warn('Stockfish load failed from', url, err);
                    }
                }
                stockfishLoading = null;
                throw lastErr || new Error('No se pudo cargar Stockfish');
            })();

            return stockfishLoading;
        }

        function pickRandomLegalVerbose() {
            if (!chessGame) return null;
            const moves = chessGame.moves({ verbose: true });
            if (!moves.length) return null;
            return moves[Math.floor(Math.random() * moves.length)];
        }

        function applyVerboseMove(m) {
            if (!m) return false;
            const [or, oc] = algToRc(m.from);
            const [tr2, tc2] = algToRc(m.to);
            pushHistory();
            applyEngineMove(or, oc, tr2, tc2, m.promotion || 'q');
            renderBoard();
            return true;
        }

        function parseBestmove(line) {
            // bestmove e2e4 [ponder e7e5]
            const parts = String(line).trim().split(/\s+/);
            if (parts[0] !== 'bestmove' || !parts[1] || parts[1] === '(none)') return null;
            const bm = parts[1];
            if (bm.length < 4) return null;
            return {
                from: bm.slice(0, 2),
                to: bm.slice(2, 4),
                promotion: bm[4] ? bm[4].toLowerCase() : 'q'
            };
        }

        function askStockfishBestMove(fen) {
            return new Promise(async (resolve) => {
                const lv = getSfLevel();
                // Torpe: a veces mueve al azar para parecer más débil
                if (lv.blunderChance > 0 && Math.random() < lv.blunderChance) {
                    resolve(pickRandomLegalVerbose());
                    return;
                }

                try {
                    const worker = await ensureStockfish();
                    if (stockfishBusy) {
                        worker.postMessage('stop');
                    }
                    stockfishBusy = true;

                    let done = false;
                    const finish = (val) => {
                        if (done) return;
                        done = true;
                        stockfishBusy = false;
                        worker.removeEventListener('message', onMsg);
                        clearTimeout(timer);
                        resolve(val);
                    };

                    const onMsg = (e) => {
                        const line = String(e.data || '');
                        if (line.startsWith('bestmove')) {
                            const parsed = parseBestmove(line);
                            if (parsed) {
                                finish({
                                    from: parsed.from,
                                    to: parsed.to,
                                    promotion: parsed.promotion
                                });
                            } else {
                                finish(pickRandomLegalVerbose());
                            }
                        }
                    };

                    const timer = setTimeout(() => {
                        try { worker.postMessage('stop'); } catch (_) {}
                        finish(pickRandomLegalVerbose());
                    }, Math.max(2500, lv.movetime + 2000));

                    worker.addEventListener('message', onMsg);
                    worker.postMessage('stop');
                    worker.postMessage('setoption name Skill Level value ' + lv.skill);
                    worker.postMessage('position fen ' + fen);
                    worker.postMessage(`go depth ${lv.depth} movetime ${lv.movetime}`);
                } catch (err) {
                    console.warn('Stockfish no disponible, rival aleatorio:', err);
                    resolve(pickRandomLegalVerbose());
                }
            });
        }

        function scheduleOpponentIfNeeded() {
            if (!freePlayMode || !chessGame || chessGame.game_over()) return;
            const oppTurn = (userRole === 'w' && chessGame.turn() === 'b') || (userRole === 'b' && chessGame.turn() === 'w');
            if (!oppTurn) return;
            if (systemTimeout) clearTimeout(systemTimeout);
            setControlsDisabled(true);

            systemTimeout = setTimeout(async () => {
                systemTimeout = null;
                if (!chessGame || chessGame.game_over() || !freePlayMode) {
                    setControlsDisabled(false);
                    updateUI();
                    return;
                }

                const fen = chessGame.fen();
                let move = await askStockfishBestMove(fen);
                if ((!move || !move.from) && chessGame) move = pickRandomLegalVerbose();

                if (move && move.from && move.to && chessGame && !chessGame.game_over() && freePlayMode) {
                    pushHistory();
                    const [fr, fc] = algToRc(move.from);
                    const [tr, tc] = algToRc(move.to);
                    let applied = applyEngineMove(fr, fc, tr, tc, move.promotion || 'q');
                    if (!applied) {
                        const rnd = pickRandomLegalVerbose();
                        if (rnd) {
                            const [rfr, rfc] = algToRc(rnd.from);
                            const [rtr, rtc] = algToRc(rnd.to);
                            applied = applyEngineMove(rfr, rfc, rtr, rtc, rnd.promotion || 'q');
                        }
                    }
                    if (applied) renderBoard();
                    else gameHistory.pop();
                }

                setControlsDisabled(false);
                updateUI();
            }, 350);
        }

        function executeMove(fr, fc, tr, tc, moveData) {
            // Teoría: intenta motor; si falla, aplica manualmente y resincroniza
            pushHistory();

            let applied = false;
            if (chessGame) {
                const promo = (moveData && moveData.promotion) || 'q';
                const move = applyEngineMove(fr, fc, tr, tc, promo);
                if (move) {
                    applied = true;
                } else if (moveData && moveData.san) {
                    const bySan = chessGame.move(String(moveData.san).replace(/0-0-0/g, 'O-O-O').replace(/0-0/g, 'O-O'));
                    if (bySan) {
                        lastMoveSan = bySan.san;
                        syncFromChess();
                        applied = true;
                    }
                }
            }

            if (!applied) {
                if (!boardState[fr] || !boardState[fr][fc]) {
                    gameHistory.pop();
                    return;
                }
                boardState[tr][tc] = boardState[fr][fc];
                boardState[fr][fc] = '';
                if (moveData && moveData.castle && boardState[moveData.rFrom[0]][moveData.rFrom[1]]) {
                    boardState[moveData.rTo[0]][moveData.rTo[1]] = boardState[moveData.rFrom[0]][moveData.rFrom[1]];
                    boardState[moveData.rFrom[0]][moveData.rFrom[1]] = '';
                }
                if (moveData && moveData.ep) {
                    boardState[moveData.ep[0]][moveData.ep[1]] = '';
                }
                lastMoveSan = (moveData && moveData.san) || null;
                isWhiteTurn = !isWhiteTurn;
            }

            // Avance del contador de teoría: un step = blancas + negras
            if (!freePlayMode) {
                if (isWhiteTurn) currentStep++;
                if (currentStep >= theoryLength()) {
                    freePlayMode = true;
                    variationsPanelOpen = true; // mostrar variantes arriba al terminar la teoría
                }
            }

            if (!applied) {
                // Tras fallback manual, reconstruir el motor para que la partida libre sea legal
                resyncChessFromTheoryProgress();
            }

            clearSelection();
            renderBoard();
            if (freePlayMode) scheduleOpponentIfNeeded();
        }

        function executeFreeMove(fr, fc, tr, tc) {
            if (!chessGame || chessGame.game_over()) return false;
            pushHistory();
            const move = applyEngineMove(fr, fc, tr, tc, 'q');
            if (!move) {
                gameHistory.pop();
                return false;
            }
            clearSelection();
            renderBoard();
            scheduleOpponentIfNeeded();
            return true;
        }

        function autoPlayOpponent() {
            systemTimeout = null;
            if (freePlayMode || !currentSteps || currentStep >= theoryLength()) {
                setControlsDisabled(false);
                updateUI();
                return;
            }
            const step = currentSteps[currentStep];
            if (!step) {
                setControlsDisabled(false);
                return;
            }
            const move = isWhiteTurn ? step.w : step.b;
            if (move) {
                executeMove(move.from[0], move.from[1], move.to[0], move.to[1], move);
            }
            setControlsDisabled(false);
            updateUI();
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            if (!boardEl) return;
            boardEl.innerHTML = '';
            const flip = userRole === 'b';
            const legalSet = new Set(legalTargets);

            for (let r = 0; r < 8; r++) {
                const rowIdx = flip ? 7 - r : r;
                for (let c = 0; c < 8; c++) {
                    const colIdx = flip ? 7 - c : c;
                    const isLight = (rowIdx + colIdx) % 2 === 0;
                    const square = document.createElement('div');
                    const isSelected = selectedSquare && selectedSquare.r === rowIdx && selectedSquare.c === colIdx;
                    const alg = rcToAlg(rowIdx, colIdx);
                    const isLegal = legalSet.has(alg);
                    const isCapture = isLegal && boardState[rowIdx][colIdx];
                    let cls = `square ${isLight ? 'light' : 'dark'}`;
                    if (isSelected) cls += ' selected';
                    if (isLegal && !isCapture) cls += ' legal-target';
                    if (isCapture) cls += ' legal-capture';
                    square.className = cls;
                    square.dataset.row = rowIdx;
                    square.dataset.col = colIdx;
                    if (colIdx === (flip ? 7 : 0)) square.innerHTML += `<div class="coord-row">${8 - rowIdx}</div>`;
                    if (rowIdx === (flip ? 0 : 7)) square.innerHTML += `<div class="coord-col">${FILE_LETTERS[colIdx]}</div>`;

                    const p = boardState[rowIdx][colIdx];
                    if (p) {
                        const piece = document.createElement('div');
                        piece.className = 'piece';
                        piece.style.backgroundImage = `url(${getPieceImageUrl(p)})`;
                        square.draggable = isSelectablePiece(p);
                        square.appendChild(piece);
                    }

                    square.addEventListener('dragstart', (e) => {
                        const pieceHere = boardState[rowIdx][colIdx];
                        if (!isSelectablePiece(pieceHere)) { e.preventDefault(); return; }
                        dragFrom = { r: rowIdx, c: colIdx };
                        selectedSquare = { r: rowIdx, c: colIdx };
                        legalTargets = freePlayMode ? getLegalTargetsFor(rowIdx, colIdx) : [];
                        e.dataTransfer.effectAllowed = 'move';
                        try { e.dataTransfer.setData('text/plain', `${rowIdx},${colIdx}`); } catch (_) {}
                    });
                    square.addEventListener('dragend', () => { dragFrom = null; });
                    square.addEventListener('dragover', (e) => e.preventDefault());
                    square.addEventListener('drop', (e) => {
                        e.preventDefault();
                        const from = dragFrom || selectedSquare;
                        if (from) handleMoveAttempt(from.r, from.c, rowIdx, colIdx);
                        dragFrom = null;
                    });

                    square.addEventListener('click', () => {
                        if (Date.now() < ignoreClickUntil) return;
                        handleSquareActivate(rowIdx, colIdx);
                    });

                    square.addEventListener('touchstart', (e) => {
                        if (e.touches.length !== 1) return;
                        e.preventDefault();
                        touchState = {
                            r: rowIdx, c: colIdx, moved: false,
                            startX: e.touches[0].clientX, startY: e.touches[0].clientY
                        };
                    }, { passive: false });

                    square.addEventListener('touchmove', (e) => {
                        if (!touchState || e.touches.length !== 1) return;
                        e.preventDefault();
                        const dx = e.touches[0].clientX - touchState.startX;
                        const dy = e.touches[0].clientY - touchState.startY;
                        if (Math.hypot(dx, dy) > 10) touchState.moved = true;
                    }, { passive: false });

                    square.addEventListener('touchend', (e) => {
                        if (!touchState) return;
                        e.preventDefault();
                        ignoreClickUntil = Date.now() + 450;
                        const t = e.changedTouches[0];
                        const el = document.elementFromPoint(t.clientX, t.clientY);
                        const targetSq = el && el.closest ? el.closest('.square') : null;
                        const tr = targetSq ? parseInt(targetSq.dataset.row, 10) : touchState.r;
                        const tc = targetSq ? parseInt(targetSq.dataset.col, 10) : touchState.c;
                        const startR = touchState.r, startC = touchState.c, wasDrag = touchState.moved;
                        touchState = null;
                        if (wasDrag) {
                            const originPiece = boardState[startR][startC];
                            if (isSelectablePiece(originPiece) && (tr !== startR || tc !== startC)) {
                                selectedSquare = { r: startR, c: startC };
                                handleMoveAttempt(startR, startC, tr, tc);
                            } else if (selectedSquare && (tr !== selectedSquare.r || tc !== selectedSquare.c)) {
                                handleMoveAttempt(selectedSquare.r, selectedSquare.c, tr, tc);
                            }
                        } else {
                            handleSquareActivate(tr, tc);
                        }
                    }, { passive: false });

                    square.addEventListener('touchcancel', () => { touchState = null; });
                    boardEl.appendChild(square);
                }
            }
        }

        function highlightSelectionOnly() {
            document.querySelectorAll('.square.selected').forEach(el => el.classList.remove('selected'));
            document.querySelectorAll('.square.legal-target, .square.legal-capture').forEach(el => {
                el.classList.remove('legal-target', 'legal-capture');
            });
            if (!selectedSquare) return;
            const sq = document.querySelector(`.square[data-row="${selectedSquare.r}"][data-col="${selectedSquare.c}"]`);
            if (sq) sq.classList.add('selected');
            legalTargets.forEach(alg => {
                const [r, c] = algToRc(alg);
                const cell = document.querySelector(`.square[data-row="${r}"][data-col="${c}"]`);
                if (!cell) return;
                if (boardState[r][c]) cell.classList.add('legal-capture');
                else cell.classList.add('legal-target');
            });
        }

        function handleSquareActivate(rowIdx, colIdx) {
            if (!currentSteps || currentSteps.length === 0) return;
            // Bloquear solo si no hay teoría ni modo libre (no debería pasar)
            if (!freePlayMode && currentStep >= theoryLength()) {
                freePlayMode = true;
            }
            if (chessGame && chessGame.game_over()) return;

            const pieceHere = boardState[rowIdx][colIdx];

            if (!selectedSquare) {
                if (isSelectablePiece(pieceHere)) {
                    selectedSquare = { r: rowIdx, c: colIdx };
                    legalTargets = freePlayMode ? getLegalTargetsFor(rowIdx, colIdx) : [];
                    highlightSelectionOnly();
                }
                return;
            }

            if (selectedSquare.r === rowIdx && selectedSquare.c === colIdx) {
                clearSelection();
                highlightSelectionOnly();
                return;
            }

            if (isSelectablePiece(pieceHere)) {
                selectedSquare = { r: rowIdx, c: colIdx };
                legalTargets = freePlayMode ? getLegalTargetsFor(rowIdx, colIdx) : [];
                highlightSelectionOnly();
                return;
            }

            handleMoveAttempt(selectedSquare.r, selectedSquare.c, rowIdx, colIdx);
        }

        function handleMoveAttempt(fr, fc, tr, tc) {
            if (fr === tr && fc === tc) return;

            enterFreePlayIfNeeded();

            if (freePlayMode) {
                const ok = executeFreeMove(fr, fc, tr, tc);
                if (!ok) {
                    const sq = document.querySelector(`.square[data-row="${tr}"][data-col="${tc}"]`);
                    if (sq) {
                        sq.classList.add('error-highlight');
                        setTimeout(() => sq.classList.remove('error-highlight'), 450);
                    }
                    highlightSelectionOnly();
                } else {
                    updateUI();
                }
                return;
            }

            if (!currentSteps || currentStep >= theoryLength()) {
                freePlayMode = true;
                handleMoveAttempt(fr, fc, tr, tc);
                return;
            }

            const step = currentSteps[currentStep];
            const expected = isWhiteTurn ? step.w : step.b;
            if (expected && fr === expected.from[0] && fc === expected.from[1] && tr === expected.to[0] && tc === expected.to[1]) {
                clearSelection();
                executeMove(fr, fc, tr, tc, expected);
                if (!freePlayMode && currentStep < theoryLength()) {
                    setControlsDisabled(true);
                    systemTimeout = setTimeout(autoPlayOpponent, 800);
                }
                updateUI();
            } else {
                const sq = document.querySelector(`.square[data-row="${tr}"][data-col="${tc}"]`);
                if (sq) {
                    sq.classList.add('error-highlight');
                    setTimeout(() => sq.classList.remove('error-highlight'), 500);
                }
                highlightSelectionOnly();
            }
        }

        function updateGameStatusBanner() {
            const el = document.getElementById('game-status');
            if (!el) return;
            if (!chessGame || !freePlayMode) {
                el.classList.add('hidden');
                el.textContent = '';
                return;
            }
            el.classList.remove('hidden');
            if (chessGame.in_checkmate()) {
                el.textContent = chessGame.turn() === 'w'
                    ? 'Jaque mate. Ganan las negras.'
                    : 'Jaque mate. Ganan las blancas.';
                el.className = 'mt-3 text-sm font-bold text-rose-400';
            } else if (chessGame.in_stalemate()) {
                el.textContent = 'Ahogado: tablas.';
                el.className = 'mt-3 text-sm font-bold text-amber-300';
            } else if (chessGame.in_draw()) {
                el.textContent = 'Tablas (regla de tablas del reglamento).';
                el.className = 'mt-3 text-sm font-bold text-amber-300';
            } else if (chessGame.in_check()) {
                el.textContent = (chessGame.turn() === 'w' ? 'Jaque al rey blanco.' : 'Jaque al rey negro.') + ' Debes resolver el jaque.';
                el.className = 'mt-3 text-sm font-bold text-orange-300';
            } else {
                const lv = getSfLevel();
                el.textContent = `Partida libre vs Stockfish (${lv.name}): reglas completas. Pulsa el botón SF para cambiar nivel (Torpe → Básico → Medio → Avanzado).`;
                el.className = 'mt-3 text-sm text-slate-400';
            }
        }

        function updateUI() {
            const levelInd = document.getElementById('level-indicator');
            const levelTotal = document.getElementById('level-total');
            const modeLabel = document.getElementById('mode-label');
            const progress = document.getElementById('progress-bar');
            const inst = document.getElementById('instruction-text');
            const theory = document.getElementById('theory-text');
            const turn = document.getElementById('turn-indicator');
            const next = document.getElementById('next-move-preview');
            const varContainer = document.getElementById('variations-container');
            const openingName = getOpeningTitle();

            if (!currentSteps || currentSteps.length === 0) return;

            enterFreePlayIfNeeded();

            if (freePlayMode || currentStep >= theoryLength()) {
                freePlayMode = true;
                if (modeLabel) modeLabel.textContent = 'Partida libre';
                if (levelInd) levelInd.textContent = '';
                if (levelTotal) levelTotal.textContent = '';
                progress.style.width = '100%';
                const isUserTurn = (userRole === 'w' && isWhiteTurn) || (userRole === 'b' && !isWhiteTurn);
                turn.textContent = chessGame && chessGame.game_over()
                    ? 'Fin'
                    : (isWhiteTurn ? 'Blancas' : 'Negras');
                next.textContent = lastMoveSan || '—';
                if (chessGame && chessGame.game_over()) {
                    inst.textContent = 'La partida ha terminado.';
                    theory.textContent = 'Puedes reiniciar la apertura, elegir otra variante o volver al menú. El tablero ha respetado todas las reglas oficiales del ajedrez.';
                } else {
                    inst.textContent = isUserTurn
                        ? 'Teoría completada. Continúa la partida con movimientos legales.'
                        : 'El rival está pensando…';
                    const lv = getSfLevel();
                    theory.textContent = `Has memorizado la línea teórica. Ahora te enfrentas a Stockfish en nivel «${lv.name}» (cámbialo con el botón SF). El tablero aplica el reglamento completo: jaque, enroque, al paso y coronación. Usa Variantes para otras líneas de ${openingName}.`;
                }
                updatePreviousTheoryUI(openingName);
                updateGameStatusBanner();
                // Solo refrescar/mostrar variantes si el panel está abierto (o se acaba de abrir al terminar teoría)
                if (variationsPanelOpen) renderVariationsList();
                else hideVariationsList();
                return;
            }

            updateGameStatusBanner();
            // En teoría, no forzar cierre si el usuario abrió el panel con el botón
            if (!variationsPanelOpen && varContainer) {
                varContainer.classList.add('hidden');
            }
            if (modeLabel) modeLabel.textContent = 'Jugada';
            if (levelTotal) levelTotal.textContent = '/' + theoryLength();

            const step = currentSteps[currentStep];
            if (!step) return;

            const move = isWhiteTurn ? step.w : step.b;
            levelInd.textContent = currentStep + 1;
            progress.style.width = `${(currentStep / Math.max(theoryLength(), 1)) * 100}%`;
            next.textContent = (move && move.san) || '--';

            const isUserTurn = (userRole === 'w' && isWhiteTurn) || (userRole === 'b' && !isWhiteTurn);
            const fw = (step.instW) || (step.w && step.w.san ? `Juega ${step.w.san}` : 'Jugada de blancas');
            const fb = (step.instB) || (step.b && step.b.san ? `Juega ${step.b.san}` : 'Jugada de negras');
            const tw = buildFullTheory(step.w && step.w.san, true, step.teoriaW, openingName);
            const tb = buildFullTheory(step.b && step.b.san, false, step.teoriaB, openingName);

            if (isUserTurn) {
                turn.textContent = isWhiteTurn ? 'Blancas' : 'Negras';
                inst.textContent = isWhiteTurn ? fw : fb;
                theory.textContent = isWhiteTurn ? tw : tb;
            } else {
                turn.textContent = 'Rival…';
                inst.textContent = 'Preparando la respuesta teórica…';
                theory.textContent = isWhiteTurn ? tw : tb;
            }
            updatePreviousTheoryUI(openingName);
        }

        function renderCards() {
            const g = document.getElementById('openings-grid');
            g.innerHTML = '';
            chessOpeningsList.forEach(op => {
                const btn = document.createElement('button');
                btn.className = 'opening-card bg-slate-800 border border-slate-700 rounded-2xl p-6 text-left flex flex-col justify-between';
                btn.onclick = () => startOpening(op.id);
                const group = normalizeOpeningType(op.type);
                btn.innerHTML = `<span class="text-[10px] font-black text-emerald-400 uppercase mb-4 block">${group}${op.type === 'Flanco' ? ' · Flanco' : ''}</span><h3 class="text-2xl font-black text-white leading-tight">${op.name}</h3>`;
                g.appendChild(btn);
            });
            buildAllCatMenus();
        }

        function backToMenu() {
            if (systemTimeout) clearTimeout(systemTimeout);
            const gv = document.getElementById('game-view');
            gv.classList.add('hidden');
            gv.classList.remove('flex');
            document.getElementById('menu-view').classList.remove('hidden');
            currentSteps = [];
            activeOpeningId = null;
            freePlayMode = false;
            clearSelection();
            hideVariationsList();
            initGame();
        }

        function switchRole(r) {
            userRole = r;
            const w = document.getElementById('btn-white');
            const b = document.getElementById('btn-black');
            if (w) {
                w.classList.toggle('active', r === 'w');
                w.setAttribute('aria-pressed', r === 'w' ? 'true' : 'false');
            }
            if (b) {
                b.classList.toggle('active', r === 'b');
                b.setAttribute('aria-pressed', r === 'b' ? 'true' : 'false');
            }
            // En partida libre, solo girar el tablero sin reiniciar
            if (freePlayMode && chessGame) {
                clearSelection();
                renderBoard();
                updateUI();
                return;
            }
            initGame();
        }

        window.onload = () => {
            if (typeof Chess === 'undefined') {
                console.warn('chess.js no disponible');
            }
            refreshPiecesUrlMap();
            applyBoardTheme();
            applyBoardSize();
            applyPieceSet();
            updateStockfishUI();
            renderCards();
            switchRole('w');
            // Precargar Stockfish en segundo plano
            ensureStockfish().catch(() => {});
        };
    </script>
</body>
</html>
