<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende aperturas - Edición Gran Maestro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fira+Code&display=swap');
        
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: 'Inter', sans-serif; 
        }

        .opening-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .opening-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px -10px rgba(16, 185, 129, 0.4);
            border-color: #10b981;
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            max-width: 520px;
            aspect-ratio: 1 / 1;
            border: 8px solid #334155;
            border-radius: 12px;
            box-shadow: 0 25px 60px -12px rgba(0,0,0,0.7);
            position: relative;
            overflow: hidden;
        }

        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .square.light { background-color: #f1f5f9; }
        .square.dark { background-color: #475569; }
        .square.error-highlight { background-color: rgba(239, 68, 68, 0.8) !important; }

        .piece {
            width: 92%;
            height: 92%;
            cursor: grab;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            user-select: none;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .piece:active { cursor: grabbing; }

        .coord-col { position: absolute; bottom: 2px; right: 4px; font-size: 10px; font-weight: 800; color: #94a3b8; pointer-events: none; }
        .coord-row { position: absolute; top: 2px; left: 4px; font-size: 10px; font-weight: 800; color: #94a3b8; pointer-events: none; }
        .square.dark .coord-col, .square.dark .coord-row { color: #cbd5e1; }

        .terminal {
            font-family: 'Fira Code', monospace;
            background-color: #020617;
            border: 1px solid #334155;
        }

        .btn-disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <div id="menu-view" class="w-full flex flex-col items-center max-w-7xl">

        </main>
    </div>

                </button>
                <div>
                    <h1 id="game-title" class="text-3xl font-black leading-tight tracking-tight">Apertura</h1>
                    <p id="game-subtitle" class="text-emerald-400 font-bold text-sm uppercase tracking-widest">Análisis de Gran Maestro</p>
                </div>
            </div>
            
            <div class="flex flex-wrap justify-center gap-4">
                <button id="btn-undo-move" onclick="undoMove()" class="px-6 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold border border-slate-500 transition-all shadow-md">Retroceder</button>
                <button id="btn-next-move" onclick="stepNextMove()" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-bold border border-emerald-400 transition-all shadow-lg">Auto-Jugada</button>
                
                <!-- PARTE 1 & 2: Botón de Salto Actualizado -->
                <button id="btn-skip" onclick="skipToVariations()" class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-bold border border-slate-600 transition-all shadow-md text-sm flex items-center">Variantes ⏩</button>

                <div class="flex bg-slate-800 p-1.5 rounded-xl border border-slate-700 shadow-inner">
                    <button id="btn-white" onclick="switchRole('w')" class="px-5 py-2 rounded-lg font-black text-xs uppercase transition-all">Blancas</button>
                    <button id="btn-black" onclick="switchRole('b')" class="px-5 py-2 rounded-lg font-black text-xs uppercase transition-all">Negras</button>
                </div>
            </div>
        </header>

        <main class="w-full grid grid-cols-1 lg:grid-cols-2 gap-10">
            <div class="flex justify-center items-start">
                <div id="board" class="chessboard"></div>
            </div>
            
            <div class="flex flex-col gap-6">
                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-black text-white">Jugada <span id="level-indicator" class="text-emerald-400">1</span>/10</h2>
                        <span id="turn-indicator" class="px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-widest bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">Blancas</span>
                    </div>
                    <div class="w-full bg-slate-900 rounded-full h-3 overflow-hidden p-0.5 border border-slate-700">
                        <div id="progress-bar" class="bg-gradient-to-r from-emerald-500 to-cyan-500 h-full rounded-full transition-all duration-700" style="width: 10%"></div>
                    </div>
                </div>

                <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-2xl flex-grow flex flex-col gap-5">
                    <div>
                        <h4 class="text-xs font-black text-slate-500 uppercase tracking-widest mb-2">Instrucción Actual</h4>
                        <p id="instruction-text" class="text-xl font-bold text-white leading-tight"></p>
                    </div>
                    
                    <div class="p-5 bg-slate-900 rounded-xl border-l-4 border-emerald-500">
                        <h4 class="text-[10px] font-black text-emerald-500 uppercase mb-2 tracking-[0.2em]">Notación Teórica</h4>
                        <div id="next-move-preview" class="text-4xl font-black text-white font-mono">--</div>
                    </div>

                    <div>

                        <p id="theory-text" class="text-base text-slate-300 italic leading-relaxed"></p>
                    </div>

                    <div id="variations-container" class="hidden flex flex-col gap-3 mt-2 border-t border-slate-700 pt-4"></div>
                </div>
            </div>
        </main>
    </div>

            renderBoard();
            updateUI();
            setControlsDisabled(false);
            if (userRole === 'b' && isWhiteTurn && currentSteps && currentSteps.length > 0) {
                setControlsDisabled(true);
                systemTimeout = setTimeout(autoPlayOpponent, 1000);
            }
        }

        function setControlsDisabled(disabled) {
            const btns = ['btn-undo-move', 'btn-next-move', 'btn-white', 'btn-black'];
            btns.forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    if(disabled) el.classList.add('btn-disabled');
                    else el.classList.remove('btn-disabled');
                }
            });
        }

        function undoMove() {
            if (gameHistory.length === 0) return;
            const isMyTurn = (userRole === 'w' && isWhiteTurn) || (userRole === 'b' && !isWhiteTurn);
            let stepsToUndo = (isMyTurn && gameHistory.length >= 2) ? 2 : 1;
            for (let i = 0; i < stepsToUndo; i++) {
                if (gameHistory.length > 0) {
                    const lastState = gameHistory.pop();
                    boardState = lastState.board;
                    isWhiteTurn = lastState.whiteTurn;
                    currentStep = lastState.step;
                }
            }
            renderBoard();
            updateUI();
        }

        function stepNextMove() {
            if (!currentSteps || currentStep >= currentSteps.length) return;
            const step = currentSteps[currentStep];
            const expected = isWhiteTurn ? step.w : step.b;
            executeMove(expected.from[0], expected.from[1], expected.to[0], expected.to[1], expected);
            if (currentStep < currentSteps.length) {
                setControlsDisabled(true);
                systemTimeout = setTimeout(autoPlayOpponent, 800);
            }
            updateUI();
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            const flip = userRole === 'b';
            for (let r = 0; r < 8; r++) {
                const rowIdx = flip ? 7 - r : r;
                for (let c = 0; c < 8; c++) {
                    const colIdx = flip ? 7 - c : c;
                    const isLight = (rowIdx + colIdx) % 2 === 0;
                    const square = document.createElement('div');
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    square.dataset.row = rowIdx;
                    square.dataset.col = colIdx;
                    if (colIdx === (flip ? 7 : 0)) square.innerHTML += `<div class="coord-row">${8-rowIdx}</div>`;
                    if (rowIdx === (flip ? 0 : 7)) square.innerHTML += `<div class="coord-col">${String.fromCharCode(97+colIdx)}</div>`;
                    
                    const p = boardState[rowIdx][colIdx];
                    if (p) {
                        const piece = document.createElement('div');
                        piece.className = 'piece';
                        piece.style.backgroundImage = `url(${PIECES_URL[p]})`;
                        piece.draggable = true;
                        piece.addEventListener('dragstart', (e) => {
                            const isWhite = p === p.toUpperCase();
                            if ((isWhiteTurn && !isWhite) || (!isWhiteTurn && isWhite)) { e.preventDefault(); return; }
                            dragFrom = {r: rowIdx, c: colIdx};
                        });
                        square.appendChild(piece);
                    }
                    
                    square.addEventListener('dragover', (e) => e.preventDefault());
                    square.addEventListener('drop', (e) => {
                        e.preventDefault();
                        if (dragFrom) handleMoveAttempt(dragFrom.r, dragFrom.c, rowIdx, colIdx);
                    });
                    boardEl.appendChild(square);
                }
            }
        }

        function handleMoveAttempt(fr, fc, tr, tc) {
            if (!currentSteps || currentStep >= currentSteps.length) return;
            const step = currentSteps[currentStep];
            const expected = isWhiteTurn ? step.w : step.b;
            if (fr === expected.from[0] && fc === expected.from[1] && tr === expected.to[0] && tc === expected.to[1]) {
                executeMove(fr, fc, tr, tc, expected);
                if (currentStep < currentSteps.length) {
                    setControlsDisabled(true);
                    systemTimeout = setTimeout(autoPlayOpponent, 800);
                }
                updateUI();
            } else {
                const sq = document.querySelector(`.square[data-row="${tr}"][data-col="${tc}"]`);
                if(sq) { sq.classList.add('error-highlight'); setTimeout(() => sq.classList.remove('error-highlight'), 500); }
            }
        }

        function executeMove(fr, fc, tr, tc, moveData) {
            if (!boardState[fr][fc]) return; // Fallback crítico: si las coordenadas están vacías cancela para no colgar la UI.
            gameHistory.push({ board: JSON.parse(JSON.stringify(boardState)), whiteTurn: isWhiteTurn, step: currentStep });
            
            boardState[tr][tc] = boardState[fr][fc];
            boardState[fr][fc] = '';
            
            // Lógica de enroque
            if (moveData.castle && boardState[moveData.rFrom[0]][moveData.rFrom[1]]) {
                boardState[moveData.rTo[0]][moveData.rTo[1]] = boardState[moveData.rFrom[0]][moveData.rFrom[1]];
                boardState[moveData.rFrom[0]][moveData.rFrom[1]] = '';
            }
            
            // Lógica Captura al Paso (En Passant)
            if (moveData.ep) {
                boardState[moveData.ep[0]][moveData.ep[1]] = '';
            }

            isWhiteTurn = !isWhiteTurn;
            if (isWhiteTurn) currentStep++; // Un "Step" abarca Blanca+Negra
            renderBoard();
        }

        function autoPlayOpponent() {
            systemTimeout = null;
            if (!currentSteps || currentStep >= currentSteps.length) { setControlsDisabled(false); return; }
            const step = currentSteps[currentStep];
            const move = isWhiteTurn ? step.w : step.b;
            executeMove(move.from[0], move.from[1], move.to[0], move.to[1], move);
            setControlsDisabled(false);
            updateUI();
        }

        function updateUI() {
            const levelInd = document.getElementById('level-indicator');
            const progress = document.getElementById('progress-bar');
            const inst = document.getElementById('instruction-text');
            const theory = document.getElementById('theory-text');
            const turn = document.getElementById('turn-indicator');
            const next = document.getElementById('next-move-preview');
            const varContainer = document.getElementById('variations-container'); // NUEVO
            
            if (!currentSteps || currentSteps.length === 0) return;
            
            if (currentStep >= 10) {
                progress.style.width = '100%';
                turn.textContent = "Final";
                inst.textContent = "¡Teoría Completada!";
                theory.textContent = "Has dominado esta variante de memoria.";
                next.textContent = "FIN";

                // PARTE 3: Mostrar contenedor de variantes si existen
                if (activeOpeningId && OPENING_MODULES[activeOpeningId].variations) {
                    varContainer.innerHTML = '<h4 class="text-[10px] font-black text-cyan-400 uppercase tracking-[0.2em] mb-1 mt-2">Aprender Variantes</h4>';
                    OPENING_MODULES[activeOpeningId].variations.forEach((v, index) => {
                        const btn = document.createElement('button');
                        btn.className = "w-full text-left px-4 py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold border border-slate-500 transition-all text-sm text-white flex justify-between items-center group shadow-md";
                        btn.innerHTML = `<span>${v.name}</span> <span class="text-xs text-slate-400 font-normal group-hover:text-slate-200 transition-colors">${v.subtitle} &rarr;</span>`;
                        btn.onclick = () => loadVariation(v); // PARTE 4: Conectado a la nueva función
                        varContainer.appendChild(btn);
                    });
                    varContainer.classList.remove('hidden');
                }
                
                return;
            }
            
            // Ocultar variantes automáticamente si retrocedemos de la jugada 10
            if(varContainer) varContainer.classList.add('hidden');
            
            const step = currentSteps[currentStep];
            if (!step) return; 
            
            const move = isWhiteTurn ? step.w : step.b;
            levelInd.textContent = currentStep + 1;
            progress.style.width = `${(currentStep / 10) * 100}%`;
            next.textContent = move.san;
            
            const isUserTurn = (userRole === 'w' && isWhiteTurn) || (userRole === 'b' && !isWhiteTurn);
            
            // Fallback en textos teóricos para aperturas no anotadas a mano 
            // Esto previene resultados `undefined` en la UI
            const fw = step.instW || `Juega ${step.w.san}`;
            const fb = step.instB || `Juega ${step.b.san}`;
            const tw = step.teoriaW || "Línea teórica de desarrollo.";
            const tb = step.teoriaB || "Respuesta posicional estándar.";

            if (isUserTurn) {
                turn.textContent = isWhiteTurn ? "Blancas" : "Negras";
                inst.textContent = isWhiteTurn ? fw : fb;
                theory.textContent = isWhiteTurn ? tw : tb;
            } else {
                turn.textContent = "IA Jugando...";
                inst.textContent = "Preparando respuesta...";
                theory.textContent = isWhiteTurn ? tw : tb;
            }
        }

        function renderCards() {
            const g = document.getElementById('openings-grid');
            g.innerHTML = '';
            chessOpeningsList.forEach(op => {
                const btn = document.createElement('button');
                btn.className = "opening-card bg-slate-800 border border-slate-700 rounded-2xl p-6 text-left flex flex-col justify-between";
                btn.onclick = () => {
                    activeOpeningId = op.id; // NUEVO: Guardamos el ID de la apertura al hacer clic
                    currentSteps = OPENING_MODULES[op.id].steps;
                    document.getElementById('game-title').textContent = OPENING_MODULES[op.id].title;
                    document.getElementById('game-title').className = `text-4xl font-black ${OPENING_MODULES[op.id].theme}`;
                    document.getElementById('game-subtitle').textContent = OPENING_MODULES[op.id].subtitle;
                    document.getElementById('menu-view').classList.add('hidden');
                    document.getElementById('game-view').classList.remove('hidden');
                    initGame();
                };
                btn.innerHTML = `<span class="text-[10px] font-black text-emerald-400 uppercase mb-4 block">${op.type}</span><h3 class="text-2xl font-black text-white leading-tight">${op.name}</h3>`;
                g.appendChild(btn);
            });
        }

        function backToMenu() {
            if(systemTimeout) clearTimeout(systemTimeout);
            document.getElementById('game-view').classList.add('hidden');
            document.getElementById('menu-view').classList.remove('hidden');
            currentSteps = [];
            activeOpeningId = null; // NUEVO: Limpieza
            
            // Limpieza visual al salir (Parte 5 adelantada)
            const varContainer = document.getElementById('variations-container');
            if(varContainer) { varContainer.classList.add('hidden'); varContainer.innerHTML = ''; } 
            
            initGame();
        }

        function switchRole(r) {
            userRole = r;
            const w = document.getElementById('btn-white');
            const b = document.getElementById('btn-black');
            w.className = r === 'w' ? 'px-5 py-2 rounded-lg font-black text-xs bg-emerald-600 text-white' : 'px-5 py-2 rounded-lg font-black text-xs text-slate-400 hover:text-slate-200';
            b.className = r === 'b' ? 'px-5 py-2 rounded-lg font-black text-xs bg-emerald-600 text-white' : 'px-5 py-2 rounded-lg font-black text-xs text-slate-400 hover:text-slate-200';
            initGame();
        }

        window.onload = () => { renderCards(); switchRole('w'); };
    </script>
</body>
</html>
