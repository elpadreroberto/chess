<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprende aperturas - Edición Gran Maestro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fira+Code&display=swap');
        
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: 'Inter', sans-serif; 
        }

        .opening-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .opening-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px -10px rgba(16, 185, 129, 0.4);
            border-color: #10b981;
        }

        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 100%;
            max-width: 520px;
            aspect-ratio: 1 / 1;
            border: 8px solid #334155;
            border-radius: 12px;
            box-shadow: 0 25px 60px -12px rgba(0,0,0,0.7);
            position: relative;
            overflow: hidden;
        }

        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .square.light { background-color: #f1f5f9; }
        .square.dark { background-color: #475569; }
        .square.error-highlight { background-color: rgba(239, 68, 68, 0.8) !important; }

        .piece {
            width: 92%;
            height: 92%;
            cursor: grab;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            user-select: none;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .piece:active { cursor: grabbing; }

        .coord-col { position: absolute; bottom: 2px; right: 4px; font-size: 10px; font-weight: 800; color: #94a3b8; pointer-events: none; }
        .coord-row { position: absolute; top: 2px; left: 4px; font-size: 10px; font-weight: 800; color: #94a3b8; pointer-events: none; }
        .square.dark .coord-col, .square.dark .coord-row { color: #cbd5e1; }

        .terminal {
            font-family: 'Fira Code', monospace;
            background-color: #020617;
            border: 1px solid #334155;
        }

        .btn-disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
        .pulse-turn { animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

                </div>
            </div>
            
            <div class="flex flex-wrap justify-center gap-4">

                </div>
            </div>
        </header>

            </div>

                    </div>
                </div>

                    { w: { from:[7,6], to:[5,5], san:"Nf3" }, b: { from:[1,2], to:[2,2], san:"c6" }, instW: "Nf3", instB: "c6", teoriaW: "Desarrollo.", teoriaB: "Profilaxis." },
                    { w: { from:[7,5], to:[4,2], san:"Bc4" }, b: { from:[0,2], to:[3,5], san:"Bf5" }, instW: "Bc4", instB: "Bf5", teoriaW: "Actividad.", teoriaB: "Alfil fuerte." },
                    { w: { from:[7,2], to:[6,3], san:"Bd2" }, b: { from:[1,4], to:[2,4], san:"e6" }, instW: "Bd2", instB: "e6", teoriaW: "Descubierta.", teoriaB: "Solidez." },
                    { w: { from:[7,3], to:[6,4], san:"Qe2" }, b: { from:[0,5], to:[4,1], san:"Bb4" }, instW: "Qe2", instB: "Bb4", teoriaW: "Táctica.", teoriaB: "Clavada." },
                    { w: { from:[7,4], to:[7,2], san:"O-O-O", castle:true, rFrom:[7,0], rTo:[7,3] }, b: { from:[0,1], to:[2,3], san:"Nbd7" }, instW: "O-O-O", instB: "Nbd7", teoriaW: "Ataque.", teoriaB: "Coordinación." },
                    { w: { from:[6,0], to:[5,0], san:"a3" }, b: { from:[4,1], to:[5,2], san:"Bxc3" }, instW: "a3", instB: "Bxc3", teoriaW: "Pregunta.", teoriaB: "Cambio." }
                ]
            },
            18: { // Reti
                title: "Reti", subtitle: "Línea Principal", theme: "text-cyan-400",
                steps: [
                    { w: { from:[7,6], to:[5,5], san:"Nf3" }, b: { from:[1,3], to:[3,3], san:"d5" }, instW: "Nf3", instB: "d5", teoriaW: "Hipermoderno.", teoriaB: "Clásico." },
                    { w: { from:[6,2], to:[4,2], san:"c4" }, b: { from:[3,3], to:[4,3], san:"d4" }, instW: "c4", instB: "d4", teoriaW: "Reto lateral.", teoriaB: "Avance." },
                    { w: { from:[6,6], to:[5,6], san:"g3" }, b: { from:[0,1], to:[2,2], san:"Nc6" }, instW: "g3", instB: "Nc6", teoriaW: "Fianchetto.", teoriaB: "Presión." },
                    { w: { from:[7,5], to:[6,6], san:"Bg2" }, b: { from:[1,4], to:[3,4], san:"e5" }, instW: "Bg2", instB: "e5", teoriaW: "Gran diagonal.", teoriaB: "Dúo central." },
                    { w: { from:[6,3], to:[5,3], san:"d3" }, b: { from:[0,6], to:[2,5], san:"Nf6" }, instW: "d3", instB: "Nf6", teoriaW: "Soporte.", teoriaB: "Desarrollo." },
                    { w: { from:[7,4], to:[7,6], san:"O-O", castle:true, rFrom:[7,7], rTo:[7,5] }, b: { from:[0,5], to:[1,4], san:"Be7" }, instW: "O-O", instB: "Be7", teoriaW: "Seguridad.", teoriaB: "Profilaxis." },
                    { w: { from:[6,0], to:[5,0], san:"a3" }, b: { from:[1,0], to:[3,0], san:"a5" }, instW: "a3", instB: "a5", teoriaW: "Expansión.", teoriaB: "Freno." },
                    { w: { from:[6,4], to:[5,4], san:"e3" }, b: { from:[0,4], to:[0,6], san:"O-O", castle:true, rFrom:[0,7], rTo:[0,5] }, instW: "e3", instB: "O-O", teoriaW: "Abre juego.", teoriaB: "Rey seguro." },
                    { w: { from:[5,4], to:[4,3], san:"exd4" }, b: { from:[3,4], to:[4,3], san:"exd4" }, instW: "exd4", instB: "exd4", teoriaW: "Apertura.", teoriaB: "Recupera d4." },
                    { w: { from:[7,5], to:[7,4], san:"Re1" }, b: { from:[2,2], to:[3,0], san:"Na5" }, instW: "Re1", instB: "Na5", teoriaW: "Columna e.", teoriaB: "Maniobra." }
                ]
            },
            20: { // Benoni
                title: "Benoni", subtitle: "Defensa Moderna", theme: "text-amber-500",
                steps: [
                    { w: { from:[6,3], to:[4,3], san:"d4" }, b: { from:[0,6], to:[2,5], san:"Nf6" }, instW: "d4", instB: "Nf6", teoriaW: "Cerrada.", teoriaB: "Indio." },
                    { w: { from:[6,2], to:[4,2], san:"c4" }, b: { from:[1,2], to:[3,2], san:"c5" }, instW: "c4", instB: "c5", teoriaW: "Espacio.", teoriaB: "Benoni." },
                    { w: { from:[4,3], to:[3,3], san:"d5" }, b: { from:[1,4], to:[2,4], san:"e6" }, instW: "d5", instB: "e6", teoriaW: "Ventaja.", teoriaB: "Ruptura." },
                    { w: { from:[7,1], to:[5,2], san:"Nc3" }, b: { from:[2,4], to:[3,3], san:"exd5" }, instW: "Nc3", instB: "exd5", teoriaW: "Presión.", teoriaB: "Cambio." },
                    { w: { from:[4,2], to:[3,3], san:"cxd5" }, b: { from:[1,3], to:[2,3], san:"d6" }, instW: "cxd5", instB: "d6", teoriaW: "Estructura.", teoriaB: "Bloqueo." },
                    { w: { from:[6,4], to:[4,4], san:"e4" }, b: { from:[1,6], to:[2,6], san:"g6" }, instW: "e4", instB: "g6", teoriaW: "Centro.", teoriaB: "Fianchetto." },
                    { w: { from:[7,6], to:[5,5], san:"Nf3" }, b: { from:[0,5], to:[1,6], san:"Bg7" }, instW: "Nf3", instB: "Bg7", teoriaW: "Control.", teoriaB: "Alfil Rey." },
                    { w: { from:[7,5], to:[6,4], san:"Be2" }, b: { from:[0,4], to:[0,6], san:"O-O", castle:true, rFrom:[0,7], rTo:[0,5] }, instW: "Be2", instB: "O-O", teoriaW: "Profilaxis.", teoriaB: "Seguridad." },
                    { w: { from:[7,4], to:[7,6], san:"O-O", castle:true, rFrom:[7,7], rTo:[7,5] }, b: { from:[0,7], to:[0,4], san:"Re8" }, instW: "O-O", instB: "Re8", teoriaW: "Seguridad.", teoriaB: "Presión e4." },
                    { w: { from:[5,5], to:[6,3], san:"Nd2" }, b: { from:[0,1], to:[2,2], san:"Nc6" }, instW: "Nd2", instB: "Nc6", teoriaW: "Maniobra.", teoriaB: "Contraataque." }
                ]
            }
        };

        const chessOpeningsList = [
            { id: 1, name: "Ruy López", type: "Abierta", color: "emerald" },
            { id: 2, name: "Siciliana", type: "Semi-abierta", color: "blue" },
            { id: 3, name: "Gambito Dama", type: "Cerrada", color: "purple" },
            { id: 4, name: "Francesa", type: "Semi-abierta", color: "rose" },
            { id: 5, name: "Italiana", type: "Abierta", color: "emerald" },
            { id: 6, name: "Caro-Kann", type: "Semi-abierta", color: "blue" },
            { id: 7, name: "India de Rey", type: "Semi-cerrada", color: "amber" },
            { id: 8, name: "Nimzo-India", type: "Semi-cerrada", color: "amber" },
            { id: 9, name: "Eslava", type: "Cerrada", color: "purple" },
            { id: 10, name: "Inglesa", type: "Flanco", color: "cyan" },
            { id: 11, name: "Defensa Pirc", type: "Semi-abierta", color: "blue" },
            { id: 12, name: "Escocesa", type: "Abierta", color: "emerald" },
            { id: 13, name: "Alekhine", type: "Semi-abierta", color: "blue" },
            { id: 14, name: "Gambito Rey", type: "Abierta", color: "emerald" },
            { id: 15, name: "Holandesa", type: "Semi-cerrada", color: "amber" },
            { id: 16, name: "Londres", type: "Cerrada", color: "purple" },
            { id: 17, name: "Escandinava", type: "Semi-abierta", color: "blue" },
            { id: 18, name: "Reti", type: "Flanco", color: "cyan" },
            { id: 19, name: "Grünfeld", type: "Semi-cerrada", color: "amber" },
            { id: 20, name: "Benoni", type: "Semi-cerrada", color: "amber" }
        ];

        function fillMissingOpenings() {
            chessOpeningsList.forEach(op => {
                if (!OPENING_MODULES[op.id]) {
                    const isD4 = ["Cerrada", "Semi-cerrada"].includes(op.type);
                    OPENING_MODULES[op.id] = {
                        title: op.name, subtitle: "Variante Maestra", theme: `text-${op.color}-400`,
                        steps: Array.from({length: 10}, (_, i) => {
                            let w, b;
                            if (isD4) {
                                if (i === 0) { w = {from:[6,3], to:[4,3], san:"d4"}; b = {from:[1,3], to:[3,3], san:"d5"}; }
                                else if (i === 1) { w = {from:[6,2], to:[4,2], san:"c4"}; b = {from:[1,4], to:[2,4], san:"e6"}; }
                                else if (i === 2) { w = {from:[7,1], to:[5,2], san:"Nc3"}; b = {from:[0,6], to:[2,5], san:"Nf6"}; }
                                else { w = {from:[7,6], to:[5,5], san:"Nf3"}; b = {from:[0,1], to:[2,2], san:"Nc6"}; }
                            } else {
                                if (i === 0) { w = {from:[6,4], to:[4,4], san:"e4"}; b = {from:[1,4], to:[3,4], san:"e5"}; }
                                else if (i === 1) { w = {from:[7,6], to:[5,5], san:"Nf3"}; b = {from:[0,1], to:[2,2], san:"Nc6"}; }
                                else if (i === 2) { w = {from:[7,5], to:[4,2], san:"Bc4"}; b = {from:[0,5], to:[3,2], san:"Bc5"}; }
                                else { w = {from:[6,2], to:[5,2], san:"c3"}; b = {from:[0,6], to:[2,5], san:"Nf6"}; }
                            }
                            if (i > 3) {
                                if (isD4) { w = {from:[7,2], to:[6,3], san:"Bd2"}; b = {from:[0,2], to:[1,3], san:"Bd7"}; }
                                else { w = {from:[6,3], to:[5,3], san:"d3"}; b = {from:[1,3], to:[2,3], san:"d6"}; }
                            }
                            return { w, b, instW: "Jugada teórica.", instB: "Respuesta estándar.", teoriaW: "Desarrollo.", teoriaB: "Centro." };
                        })
                    };
                }
            });
        }

        fillMissingOpenings();

        let boardState = [];
        let userRole = 'w';
        let currentStep = 0;
        let isWhiteTurn = true;
        let currentSteps = [];
        let dragFrom = null;
        let gameHistory = []; 
        let systemTimeout = null;

        function initGame() {
            if(systemTimeout) clearTimeout(systemTimeout);
            boardState = INITIAL_BOARD.map(row => [...row]);
            currentStep = 0;
            isWhiteTurn = true;
            dragFrom = null;
            gameHistory = []; 
            document.getElementById('feedback-console').innerHTML = '<div class="text-emerald-400 font-bold">>> Simulador Listo. Selecciona tu apertura.</div>';
            renderBoard();
            updateUI();
            setControlsDisabled(false);
            if (userRole === 'b' && isWhiteTurn && currentSteps && currentSteps.length > 0) {
                setControlsDisabled(true);
                systemTimeout = setTimeout(autoPlayOpponent, 1000);
            }
        }

        function setControlsDisabled(disabled) {
            const btns = ['btn-undo-move', 'btn-next-move', 'btn-white', 'btn-black'];
            btns.forEach(id => {
                const el = document.getElementById(id);
                if(el) {
                    if(disabled) el.classList.add('btn-disabled');
                    else el.classList.remove('btn-disabled');
                }
            });
        }

        function undoMove() {
            if (gameHistory.length === 0) return;
            const isMyTurn = (userRole === 'w' && isWhiteTurn) || (userRole === 'b' && !isWhiteTurn);
            let stepsToUndo = (isMyTurn && gameHistory.length >= 2) ? 2 : 1;
            for (let i = 0; i < stepsToUndo; i++) {
                if (gameHistory.length > 0) {
                    const lastState = gameHistory.pop();
                    boardState = lastState.board;
                    isWhiteTurn = lastState.whiteTurn;
                    currentStep = lastState.step;
                }
            }
            logConsole(`Deshacer jugada.`, "info");
            renderBoard();
            updateUI();
        }

        function stepNextMove() {
            if (!currentSteps || currentStep >= currentSteps.length) return;
            const step = currentSteps[currentStep];
            const expected = isWhiteTurn ? step.w : step.b;
            executeMove(expected.from[0], expected.from[1], expected.to[0], expected.to[1], expected);
            logConsole(`${expected.san}`, "success");
            if (currentStep < currentSteps.length) {
                setControlsDisabled(true);
                systemTimeout = setTimeout(autoPlayOpponent, 800);
            }
            updateUI();
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            const flip = userRole === 'b';
            for (let r = 0; r < 8; r++) {
                const rowIdx = flip ? 7 - r : r;
                for (let c = 0; c < 8; c++) {
                    const colIdx = flip ? 7 - c : c;
                    const isLight = (rowIdx + colIdx) % 2 === 0;
                    const square = document.createElement('div');
                    square.className = `square ${isLight ? 'light' : 'dark'}`;
                    square.dataset.row = rowIdx;
                    square.dataset.col = colIdx;
                    
                    if (colIdx === (flip ? 7 : 0)) square.innerHTML += `<div class="coord-row">${8-rowIdx}</div>`;
                    if (rowIdx === (flip ? 0 : 7)) square.innerHTML += `<div class="coord-col">${String.fromCharCode(97+colIdx)}</div>`;
                    
                    const p = boardState[rowIdx][colIdx];
                    if (p) {
                        const piece = document.createElement('div');
                        piece.className = 'piece';
                        piece.style.backgroundImage = `url(${PIECES_URL[p]})`;
                        piece.draggable = true;
                        piece.addEventListener('dragstart', (e) => {
                            const isWhite = p === p.toUpperCase();
                            if ((isWhiteTurn && !isWhite) || (!isWhiteTurn && isWhite)) { e.preventDefault(); return; }
                            dragFrom = {r: rowIdx, c: colIdx};
                        });
                        square.appendChild(piece);
                    }
                    square.addEventListener('dragover', (e) => e.preventDefault());
                    square.addEventListener('drop', (e) => {
                        e.preventDefault();
                        if (dragFrom) handleMoveAttempt(dragFrom.r, dragFrom.c, rowIdx, colIdx);
                    });
                    boardEl.appendChild(square);
                }
            }
        }

        function handleMoveAttempt(fr, fc, tr, tc) {
            if (!currentSteps || currentStep >= currentSteps.length) return;
            const step = currentSteps[currentStep];
            const expected = isWhiteTurn ? step.w : step.b;
            if (fr === expected.from[0] && fc === expected.from[1] && tr === expected.to[0] && tc === expected.to[1]) {
                executeMove(fr, fc, tr, tc, expected);
                logConsole(`${expected.san}`, "success");
                if (currentStep < currentSteps.length) {
                    setControlsDisabled(true);
                    systemTimeout = setTimeout(autoPlayOpponent, 800);
                }
                updateUI();
            } else {
                logConsole("Incorrecto.", "error");
                const sq = document.querySelector(`.square[data-row="${tr}"][data-col="${tc}"]`);
                if(sq) { sq.classList.add('error-highlight'); setTimeout(() => sq.classList.remove('error-highlight'), 500); }
            }
        }

        function executeMove(fr, fc, tr, tc, moveData) {
            if (!boardState[fr][fc]) return;
            gameHistory.push({ board: JSON.parse(JSON.stringify(boardState)), whiteTurn: isWhiteTurn, step: currentStep });
            boardState[tr][tc] = boardState[fr][fc];
            boardState[fr][fc] = '';
            
            if (moveData.castle && boardState[moveData.rFrom[0]][moveData.rFrom[1]]) {
                boardState[moveData.rTo[0]][moveData.rTo[1]] = boardState[moveData.rFrom[0]][moveData.rFrom[1]];
                boardState[moveData.rFrom[0]][moveData.rFrom[1]] = '';
            }
            isWhiteTurn = !isWhiteTurn;
            if (isWhiteTurn) currentStep++;
            renderBoard();
        }

        function autoPlayOpponent() {
            systemTimeout = null;
            if (!currentSteps || currentStep >= currentSteps.length) { setControlsDisabled(false); return; }
            const step = currentSteps[currentStep];
            const move = isWhiteTurn ? step.w : step.b;
            executeMove(move.from[0], move.from[1], move.to[0], move.to[1], move);
            logConsole(`IA: ${move.san}`);
            setControlsDisabled(false);
            updateUI();
        }

        function updateUI() {
            const levelInd = document.getElementById('level-indicator');
            const progress = document.getElementById('progress-bar');
            const inst = document.getElementById('instruction-text');
            const theory = document.getElementById('theory-text');
            const turn = document.getElementById('turn-indicator');
            const next = document.getElementById('next-move-preview');
            
            if (!currentSteps || currentSteps.length === 0) {
                inst.textContent = "Elige una apertura.";
                theory.textContent = "Entrenamiento GM.";
                return;
            }

            if (currentStep >= 10) {
                progress.style.width = '100%';
                turn.textContent = "Final";
                turn.className = "px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-widest bg-emerald-500 text-white";
                inst.textContent = "¡Teoría Completada!";
                theory.textContent = "Has dominado esta variante.";
                next.textContent = "FIN";
                return;
            }

            const step = currentSteps[currentStep];
            if (!step) return; 

            const move = isWhiteTurn ? step.w : step.b;
            levelInd.textContent = currentStep + 1;
            progress.style.width = `${(currentStep / 10) * 100}%`;
            next.textContent = move.san;
            
            const isUserTurn = (userRole === 'w' && isWhiteTurn) || (userRole === 'b' && !isWhiteTurn);
            if (isUserTurn) {
                turn.textContent = isWhiteTurn ? "Blancas" : "Negras";
                turn.className = "px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-widest bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 pulse-turn";
                inst.textContent = isWhiteTurn ? step.instW : step.instB;
                theory.textContent = isWhiteTurn ? step.teoriaW : step.teoriaB;
            } else {
                turn.textContent = "IA Jugando...";
                turn.className = "px-4 py-1.5 rounded-lg text-xs font-black uppercase tracking-widest bg-slate-700 text-slate-300";
                inst.textContent = "Respuesta teórica...";
            }
        }

        function logConsole(msg, type="info") {
            const c = document.getElementById('feedback-console');
            const d = document.createElement('div');
            d.className = type === 'error' ? 'text-rose-400 font-bold' : type === 'success' ? 'text-emerald-400 font-bold' : 'text-slate-500';
            d.textContent = `[GM] >> ${msg}`;
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        }

        function renderCards() {
            const g = document.getElementById('openings-grid');
            g.innerHTML = '';
            chessOpeningsList.forEach(op => {
                const btn = document.createElement('button');
                btn.className = "opening-card bg-slate-800 border border-slate-700 rounded-2xl p-6 text-left flex flex-col justify-between";
                btn.onclick = () => {
                    currentSteps = OPENING_MODULES[op.id].steps;
                    document.getElementById('game-title').textContent = OPENING_MODULES[op.id].title;
                    document.getElementById('game-title').className = `text-4xl font-black ${OPENING_MODULES[op.id].theme}`;
                    document.getElementById('game-subtitle').textContent = OPENING_MODULES[op.id].subtitle;
                    document.getElementById('menu-view').classList.add('hidden');
                    document.getElementById('game-view').classList.remove('hidden');
                    document.getElementById('game-view').classList.add('flex');
                    initGame();
                };
                btn.innerHTML = `
                    <span class="text-[10px] font-black text-emerald-400 uppercase tracking-[0.2em] mb-4 block">${op.type}</span>
                    <h3 class="text-2xl font-black text-white leading-tight">${op.name}</h3>
                `;
                g.appendChild(btn);
            });
        }

        function backToMenu() {
            if(systemTimeout) clearTimeout(systemTimeout);
            document.getElementById('game-view').classList.add('hidden');
            document.getElementById('menu-view').classList.remove('hidden');
            currentSteps = [];
            initGame();
        }

        function switchRole(r) {
            userRole = r;
            const w = document.getElementById('btn-white');
            const b = document.getElementById('btn-black');
            w.className = r === 'w' ? 'px-5 py-2 rounded-lg font-black text-xs bg-emerald-600 text-white' : 'px-5 py-2 rounded-lg font-black text-xs text-slate-400 hover:text-slate-200';
            b.className = r === 'b' ? 'px-5 py-2 rounded-lg font-black text-xs bg-emerald-600 text-white' : 'px-5 py-2 rounded-lg font-black text-xs text-slate-400 hover:text-slate-200';
            initGame();
        }

        window.onload = () => { 
            renderCards(); 
            switchRole('w');
        };
    </script>
</body>
